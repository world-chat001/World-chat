<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Incoming Call - WORLD CHAT</title>  <link rel="stylesheet" href="incoming-call.css">
</head><body>  <main class="incoming-page"><div class="world-icon">
  🌍
</div>

<p class="incoming-label">
  INCOMING CALL
</p>

<div
  class="caller-avatar"
  id="callerAvatar"
>
  ?
</div>

<h1 id="callerName">
  WORLD CHAT USER
</h1>

<p id="callType">
  Video call
</p>

<div class="ringing">
  Calling you...
</div>

<div class="call-actions">

  <button
    id="declineBtn"
    class="decline-btn"
    type="button"
  >
    <span>✕</span>
    <small>Decline</small>
  </button>

  <button
    id="acceptBtn"
    class="accept-btn"
    type="button"
  >
    <span>✓</span>
    <small>Accept</small>
  </button>

</div>

  </main>  <script
    type="module"
    src="incoming-call.js"
  ></script></body>
</html>
